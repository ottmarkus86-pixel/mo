name: MOSALI PS7 Validation

on:
  push:
    paths:
      - 'mosali-validation/RUN_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
      - 'mosali-validation/START_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
      - 'mosali-validation/trigger-20260824.txt'
      - '.github/workflows/mosali-ps7-validation.yml'
  pull_request:
    paths:
      - 'mosali-validation/**'
      - '.github/workflows/mosali-ps7-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Native PowerShell 7 parser and canonical SHA validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 required: $($PSVersionTable.PSVersion)" }

          function Get-CanonicalLfSha([string]$Path) {
            $text = [IO.File]::ReadAllText($Path)
            $text = $text.Replace("`r`n", "`n").Replace("`r", "`n")
            $bytes = [Text.UTF8Encoding]::new($false).GetBytes($text)
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
          }

          $files = @(
            @{
              Path = 'mosali-validation/RUN_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
              Sha  = '5179615F0A6BFB41E1864607CD05BA023C2B912F23294E2B73D90658468542D6'
            },
            @{
              Path = 'mosali-validation/START_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
              Sha  = '052073F77399057DC58025728B1E6FD52360B1163ECF34F627AA091C5086300B'
            }
          )

          $version = $PSVersionTable.PSVersion.ToString()
          Write-Host "Native pwsh version: $version"
          foreach ($item in $files) {
            $path = Join-Path $PWD $item.Path
            $actual = Get-CanonicalLfSha $path
            if ($actual -ne $item.Sha) { throw "Canonical SHA mismatch for $($item.Path): expected=$($item.Sha) actual=$actual" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PS7 parser failed for $($item.Path)"
            }
            Write-Host "PASS PS7 PARSER + CANONICAL SHA: $($item.Path)"
          }
          Write-Host 'PASS_NATIVE_PS7_VALIDATION'
