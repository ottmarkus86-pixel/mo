name: MOSALI PS7 Validation

on:
  push:
    paths:
      - 'mosali-validation/RUN_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
      - 'mosali-validation/START_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
      - 'mosali-validation/trigger-20260824.txt'
      - '.github/workflows/mosali-ps7-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Native PowerShell 7 parser and SHA validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 required: $($PSVersionTable.PSVersion)" }

          $files = @(
            @{
              Path = 'mosali-validation/RUN_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
              Sha  = '8E404547317109BF52600A7D923A372FCA0628E1FC80D02F0AB3D2281A18F29E'
            },
            @{
              Path = 'mosali-validation/START_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
              Sha  = '6C16B92B1235A957079820F1D412DF17E0AF32C7077D188FAD8390F51DABB9B6'
            }
          )

          $version = $PSVersionTable.PSVersion.ToString()
          Write-Host "Native pwsh version: $version"
          foreach ($item in $files) {
            $path = Join-Path $PWD $item.Path
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($actual -ne $item.Sha) { throw "SHA mismatch for $($item.Path): expected=$($item.Sha) actual=$actual" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PS7 parser failed for $($item.Path)"
            }
            Write-Host "PASS PS7 PARSER + SHA: $($item.Path)"
          }

          @"
          PASS_NATIVE_PS7_VALIDATION
          PowerShellVersion=$version
          RunnerSHA256=8E404547317109BF52600A7D923A372FCA0628E1FC80D02F0AB3D2281A18F29E
          LauncherSHA256=6C16B92B1235A957079820F1D412DF17E0AF32C7077D188FAD8390F51DABB9B6
          "@ | Set-Content -LiteralPath 'mosali-validation/PS7_VALIDATION_RESULT.txt' -Encoding utf8

      - name: Commit validation receipt
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mosali-validation/PS7_VALIDATION_RESULT.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record PASS native PS7 validation"
            git push
          }
