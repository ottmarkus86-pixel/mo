# trigger-20260824-v11
name: MOSALI V1.1 Native PS7 Validation

on:
  push:
    paths:
      - '.github/workflows/mosali-v11-native-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exact V1.1 runner and launcher then parse with native pwsh
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -lt 7){ throw "PowerShell 7 required" }
          $utf8=[Text.UTF8Encoding]::new($false)
          function Norm([string]$s){ $s.Replace("`r`n","`n").Replace("`r","`n") }

          $baseRunner='mosali-validation/RUN_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
          $s=Norm([IO.File]::ReadAllText($baseRunner))
          $s=$s.Replace("$Version = 'PERFORMANCE-STABILITY-FIX-V1.0'","$Version = 'PERFORMANCE-STABILITY-FIX-V1.1'")
          $s=$s.Replace('MOSALI_PERFORMANCE_STABILITY_FIX_V1_0_ERGEBNIS_{0}','MOSALI_PERFORMANCE_STABILITY_FIX_V1_1_ERGEBNIS_{0}')
          $s=$s.Replace('PERFORMANCE_STABILITY_FIX_V1_0_{0}','PERFORMANCE_STABILITY_FIX_V1_1_{0}')
          $s=$s.Replace('MOSALI_PERF_FIX_CANDIDATE_{0}','MOSALI_PERF_FIX_V1_1_CANDIDATE_{0}')
          $s=$s.Replace('MOSALI Performance Stability Fix V1.0','MOSALI Performance Stability Fix V1.1')
          $s=$s.Replace('PASS_PERFORMANCE_STABILITY_FIX_V1_0','PASS_PERFORMANCE_STABILITY_FIX_V1_1')
          $s=$s.Replace('FAIL_PERFORMANCE_STABILITY_FIX_V1_0','FAIL_PERFORMANCE_STABILITY_FIX_V1_1')

          $needle=@'
function Get-OneListener([int]$Port) {
    $x=@(Get-NetTCPConnection -State Listen -LocalPort $Port -ErrorAction SilentlyContinue)
    if($x.Count -ne 1){ throw "Port $Port ListenerCount=$($x.Count), erwartet 1." }
    return $x[0]
}
'@
          $add=@'
function Wait-OneListener([int]$Port,[int]$Seconds=120) {
    $deadline=(Get-Date).AddSeconds($Seconds)
    do {
        $x=@(Get-NetTCPConnection -State Listen -LocalPort $Port -ErrorAction SilentlyContinue)
        if($x.Count -eq 1){ return $x[0] }
        if($x.Count -gt 1){ throw "Port $Port ListenerCount=$($x.Count), erwartet maximal 1 waehrend Start." }
        Start-Sleep -Milliseconds 500
    } while((Get-Date)-lt $deadline)
    throw "Port $Port ListenerCount=0 nach ${Seconds}s."
}
'@
          if(-not $s.Contains($needle)){throw 'Runner function anchor missing'}
          $s=$s.Replace($needle,$needle+$add)

          $old=@'
    foreach($p in @($Backend,$Wake,$HermesCore,$StartupController)){ if(-not(Test-Path -LiteralPath $p -PathType Leaf)){ throw "Datei fehlt: $p" } }
    $model=Get-OneListener 1235; $simon=Get-OneListener 17861; $hermes=Get-OneListener 17865; $dash=Get-OneListener 17864
    if(-not(Test-Json 'http://127.0.0.1:17861/api/status')){throw 'Simon 17861 nicht READY.'}
    if(-not(Test-Json 'http://127.0.0.1:17865/v1/execution/capabilities')){throw 'Hermes 17865 nicht READY.'}
'@
          $new=@'
    foreach($p in @($Backend,$Wake,$HermesCore,$StartupController)){ if(-not(Test-Path -LiteralPath $p -PathType Leaf)){ throw "Datei fehlt: $p" } }

    $requiredPorts=@(1235,17861,17864,17865)
    $missing=@($requiredPorts | Where-Object { @(Get-NetTCPConnection -State Listen -LocalPort $_ -ErrorAction SilentlyContinue).Count -eq 0 })
    if($missing.Count -gt 0){
        Write-Host ("Runtime fehlt auf Port(s) {0}; kanonischer Startup Controller wird einmal ausgefuehrt." -f ($missing -join ',')) -ForegroundColor Yellow
        Start-StartupController
    }

    $model=Wait-OneListener 1235 120
    $simon=Wait-OneListener 17861 120
    $dash=Wait-OneListener 17864 120
    $hermes=Wait-OneListener 17865 120
    if(-not(Test-Json 'http://127.0.0.1:17861/api/status')){throw 'Simon 17861 nicht READY.'}
    if(-not(Test-Json 'http://127.0.0.1:17865/v1/execution/capabilities')){throw 'Hermes 17865 nicht READY.'}
'@
          if(-not $s.Contains($old)){throw 'Runner precheck anchor missing'}
          $s=$s.Replace($old,$new)
          $runnerOut='mosali-validation/RUN_MOSALI_PERFORMANCE_STABILITY_FIX_V1_1.generated.ps1'
          [IO.File]::WriteAllText($runnerOut,$s,$utf8)
          $rsha=(Get-FileHash $runnerOut -Algorithm SHA256).Hash.ToUpperInvariant()
          if($rsha -ne '25B116484E8E58FFF312F2FADF3D07692A2CF77971E334FF3A60EE2BCE1AE9CF'){throw "Runner SHA mismatch $rsha"}

          $baseLauncher='mosali-validation/START_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1'
          $l=Norm([IO.File]::ReadAllText($baseLauncher))
          $l=$l.Replace('MOSALI_PERFORMANCE_STABILITY_FIX_V1_0_20260824.zip','MOSALI_PERFORMANCE_STABILITY_FIX_V1_1_20260824.zip')
          $l=$l.Replace('DEF01982B73CA871E43681F1784D742A95ACCD0F50CFB3358309EDE087BFDACF','113CA0B94090F72641A5DEADE9A5D519578FF216B5E066EB75BFD2A27851FD5D')
          $l=$l.Replace("'MOSALI_PERFORMANCE_STABILITY_FIX_V1_0_'","'MOSALI_PERFORMANCE_STABILITY_FIX_V1_1_'")
          $l=$l.Replace('RUN_MOSALI_PERFORMANCE_STABILITY_FIX_V1_0.ps1','RUN_MOSALI_PERFORMANCE_STABILITY_FIX_V1_1.ps1')
          $l=$l.Replace('MOSALI_PERFORMANCE_STABILITY_FIX_V1_0_ERGEBNIS_*.zip','MOSALI_PERFORMANCE_STABILITY_FIX_V1_1_ERGEBNIS_*.zip')
          $launcherOut='mosali-validation/START_MOSALI_PERFORMANCE_STABILITY_FIX_V1_1.generated.ps1'
          [IO.File]::WriteAllText($launcherOut,$l,$utf8)

          foreach($p in @($runnerOut,$launcherOut)){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw "Parser fail $p"}
            Write-Host "PASS PS7 PARSER: $p"
          }
          $lsha=(Get-FileHash $launcherOut -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "Native pwsh version: $($PSVersionTable.PSVersion)"
          Write-Host "RUNNER_SHA256=$rsha"
          Write-Host "LAUNCHER_SHA256=$lsha"
          Write-Host 'PASS_NATIVE_PS7_V1_1_VALIDATION'

      - name: Commit validated generated files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mosali-validation/RUN_MOSALI_PERFORMANCE_STABILITY_FIX_V1_1.generated.ps1 mosali-validation/START_MOSALI_PERFORMANCE_STABILITY_FIX_V1_1.generated.ps1
          git commit -m "Record validated MOSALI V1.1 scripts"
          git push
